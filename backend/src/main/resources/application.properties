spring.application.name=campus-services-management

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_services}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${SERVER_PORT:8080}

# JWT secret - replace through environment configuration in real deployments
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
